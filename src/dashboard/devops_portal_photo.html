<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing Dual Robots · DevOps Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #070b14;
            cursor: crosshair;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ----- LIVE CANVAS (background) ----- */
        #mainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            cursor: crosshair;
            pointer-events: auto;
            display: block;
        }

        /* ----- DEVOPS TOOLS OVERLAY ----- */
        .devops-tools {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .tool-item {
            position: absolute;
            font-size: 28px;
            font-weight: 800;
            color: rgba(129, 140, 248, 0.25);
            text-shadow: 0 0 20px rgba(129, 140, 248, 0.15);
            animation: moveTool linear infinite;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .tool-item .tool-icon {
            display: inline-block;
            margin-right: 6px;
        }

        @keyframes moveTool {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.2; }
            10% { opacity: 0.5; }
            50% { transform: translate(var(--tx), var(--ty)) rotate(180deg) scale(1.2); opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translate(var(--tx2), var(--ty2)) rotate(360deg) scale(1); opacity: 0.2; }
        }

        .tool-item.glow {
            color: rgba(129, 140, 248, 0.5);
            text-shadow: 0 0 30px rgba(129, 140, 248, 0.3), 0 0 60px rgba(124, 58, 237, 0.2);
        }

        /* ----- GLASS CARD ----- */
        .login-card {
            width: 440px;
            background: rgba(12, 18, 34, 0.78);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(129, 140, 248, 0.6);
            border-radius: 32px;
            padding: 30px 28px 25px;
            text-align: center;
            color: #eef2f8;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 50px rgba(129, 140, 248, 0.25);
            transition: 0.4s ease;
        }
        .login-card:hover {
            border-color: rgba(129, 140, 248, 0.9);
            box-shadow: 0 25px 80px rgba(0,0,0,0.9), 0 0 70px rgba(129, 140, 248, 0.4);
        }

        /* ----- ROBOT GROUP (dual robots amazing) ----- */
        .robot-group {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 30px;
            margin-bottom: 18px;
            position: relative;
            height: 210px;
        }

        /* --- BIG ROBOT (main) --- */
        .bot-big {
            position: relative;
            z-index: 5;
            animation: floatBig 3.4s ease-in-out infinite;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 30px rgba(129, 140, 248, 0.3));
        }
        .bot-big:hover {
            filter: drop-shadow(0 0 50px rgba(129, 140, 248, 0.6));
            transform: scale(1.05);
        }
        .bot-big.tilt {
            animation: floatBig 3.4s ease-in-out infinite, tiltHead 0.6s ease-in-out 3;
        }
        @keyframes tiltHead {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        @keyframes floatBig {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        .head {
            width: 95px; height: 75px;
            background: linear-gradient(145deg, #ffffff, #d0d0d0);
            border: 4px solid #0a121c;
            border-radius: 48px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .head.tilt-head {
            animation: tiltHead 0.6s ease-in-out 3;
        }

        .antenna {
            position: absolute;
            top: -22px; left: 50%;
            transform: translateX(-50%);
            width: 4px; height: 20px;
            background: #0a121c;
        }
        .antenna::after {
            content: '';
            position: absolute;
            top: -14px; left: -7px;
            width: 18px; height: 18px;
            background: #818cf8;
            border-radius: 50%;
            box-shadow: 0 0 35px #818cf8, 0 0 70px #7c3aed;
            animation: blinkLight 2s infinite;
        }
        @keyframes blinkLight {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.9; }
        }

        .eyes {
            width: 24px; height: 28px;
            background: #0a121c;
            border-radius: 50%;
            margin: 0 8px;
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }
        .pupil {
            position: absolute;
            width: 10px; height: 10px;
            background: white;
            border-radius: 50%;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.08s;
            box-shadow: 0 0 8px #818cf8;
        }
        .eyes.glow {
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.3), 0 0 30px #818cf8;
        }

        .smile {
            position: absolute;
            bottom: 12px;
            width: 26px; height: 8px;
            border-bottom: 3px solid #0a121c;
            border-radius: 0 0 18px 18px;
            transition: all 0.3s;
        }
        .smile.happy {
            width: 32px;
            height: 12px;
            border-bottom-width: 4px;
            border-color: #818cf8;
        }

        .body {
            width: 55px; height: 48px;
            background: linear-gradient(145deg, #ffffff, #d0d0d0);
            border: 4px solid #0a121c;
            border-radius: 14px 14px 22px 22px;
            margin-top: -6px;
            position: relative;
            z-index: 4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .belly {
            position: absolute;
            top: 10px; left: 10px;
            width: 22px; height: 16px;
            background: #818cf8;
            border-radius: 12px;
            box-shadow: 0 0 24px #818cf8, 0 0 50px #7c3aed;
            transition: all 0.5s;
        }
        .belly.pulse-belly {
            animation: pulseBelly 0.6s ease-in-out 4;
        }
        @keyframes pulseBelly {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); box-shadow: 0 0 50px #818cf8, 0 0 100px #7c3aed; }
        }

        .arm {
            position: absolute;
            bottom: 4px;
            left: -40px;
            width: 16px; height: 48px;
            background: linear-gradient(to bottom, #ffffff, #c8c8c8);
            border: 4px solid #0a121c;
            border-radius: 12px;
            transform-origin: top center;
            z-index: 6;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .arm::after {
            content: '';
            position: absolute;
            bottom: -6px; left: -1px;
            width: 8px; height: 14px;
            background: #818cf8;
            border: 3px solid #0a121c;
            border-radius: 6px;
            box-shadow: 0 0 20px #818cf8;
        }
        .arm.wave {
            animation: waveHand 0.7s ease-in-out 4;
        }
        @keyframes waveHand {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(-100deg); }
            60% { transform: rotate(-30deg); }
            80% { transform: rotate(-80deg); }
            100% { transform: rotate(0deg); }
        }
        .arm.idle {
            animation: idleSway 2.8s ease-in-out infinite;
        }
        @keyframes idleSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-10deg); }
        }

        /* --- SMALL ROBOT --- */
        .bot-small {
            position: relative;
            transform: scale(0.9);
            margin-bottom: -8px;
            z-index: 4;
            animation: floatSmall 2.8s ease-in-out infinite;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 25px rgba(167, 139, 250, 0.3));
        }
        .bot-small:hover {
            filter: drop-shadow(0 0 45px rgba(167, 139, 250, 0.6));
            transform: scale(0.95);
        }
        .bot-small.tilt-small {
            animation: floatSmall 2.8s ease-in-out infinite, tiltHeadSmall 0.6s ease-in-out 3;
        }
        @keyframes tiltHeadSmall {
            0%, 100% { transform: scale(0.9) rotate(0deg); }
            25% { transform: scale(0.9) rotate(12deg); }
            75% { transform: scale(0.9) rotate(-12deg); }
        }
        @keyframes floatSmall {
            0%, 100% { transform: scale(0.9) translateY(0); }
            50% { transform: scale(0.9) translateY(-18px); }
        }

        .small-head {
            width: 78px; height: 60px;
        }
        .small-head .eyes {
            width: 18px; height: 22px;
            margin: 0 6px;
        }
        .small-head .smile {
            bottom: 8px; width: 18px; height: 6px;
        }
        .small-head .smile.happy-small {
            width: 22px;
            height: 10px;
            border-bottom-width: 4px;
            border-color: #a78bfa;
        }
        .headset-band {
            position: absolute;
            top: 0px; left: -14px;
            width: 100px; height: 52px;
            border: 4px solid #0a121c;
            border-radius: 50%;
            border-bottom-color: transparent;
            border-left-color: transparent;
            animation: bandGlow 3s ease-in-out infinite;
        }
        @keyframes bandGlow {
            0%, 100% { border-color: #0a121c; }
            50% { border-color: #a78bfa; box-shadow: 0 0 25px #a78bfa; }
        }
        .headset-mic {
            position: absolute;
            bottom: 4px; left: -10px;
            width: 3px; height: 24px;
            background: #0a121c;
        }
        .headset-mic::after {
            content: '';
            position: absolute;
            bottom: -6px; left: -4px;
            width: 12px; height: 10px;
            background: #0a121c;
            border-radius: 10px;
        }
        .small-body {
            width: 44px; height: 38px;
            background: linear-gradient(145deg, #ffffff, #d0d0d0);
            border: 4px solid #0a121c;
            border-radius: 12px 12px 16px 16px;
            margin-top: -5px;
            position: relative;
            z-index: 3;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .small-belly {
            position: absolute;
            top: 8px; left: 8px;
            width: 18px; height: 12px;
            background: #a78bfa;
            border-radius: 10px;
            box-shadow: 0 0 20px #a78bfa;
            transition: all 0.5s;
        }
        .small-belly.pulse-small {
            animation: pulseSmall 0.6s ease-in-out 4;
        }
        @keyframes pulseSmall {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); box-shadow: 0 0 40px #a78bfa, 0 0 80px #7c3aed; }
        }

        .small-arm {
            position: absolute;
            bottom: 2px;
            right: -34px;
            width: 14px; height: 40px;
            background: linear-gradient(to bottom, #ffffff, #c8c8c8);
            border: 4px solid #0a121c;
            border-radius: 10px;
            transform-origin: top center;
            z-index: 6;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .small-arm::after {
            content: '';
            position: absolute;
            bottom: -5px; right: -1px;
            width: 7px; height: 12px;
            background: #a78bfa;
            border: 3px solid #0a121c;
            border-radius: 5px;
            box-shadow: 0 0 18px #a78bfa;
        }
        .small-arm.idle-small {
            animation: idleSwaySmall 3.2s ease-in-out infinite;
        }
        @keyframes idleSwaySmall {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(14deg); }
        }
        .small-arm.wave-small {
            animation: waveHandSmall 0.6s ease-in-out 4;
        }
        @keyframes waveHandSmall {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(90deg); }
            60% { transform: rotate(30deg); }
            80% { transform: rotate(70deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- PHOTO ROBOTS (replace CSS-drawn bots with the real image) --- */
        .bot-img {
            display: block;
            filter: drop-shadow(0 0 25px rgba(80,150,255,0.35));
            -webkit-mask-image: radial-gradient(ellipse 72% 78% at 50% 42%, black 60%, transparent 100%);
            mask-image: radial-gradient(ellipse 72% 78% at 50% 42%, black 60%, transparent 100%);
        }
        .bot-img-big { width: 150px; }
        .bot-img-small { width: 98px; transform: scaleX(-1); }

        @keyframes wobbleBig {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-7deg); }
            75% { transform: rotate(7deg); }
        }
        @keyframes wobbleSmall {
            0%, 100% { transform: scaleX(-1) rotate(0deg); }
            25% { transform: scaleX(-1) rotate(7deg); }
            75% { transform: scaleX(-1) rotate(-7deg); }
        }
        .bot-img-big.tilt-head { animation: wobbleBig 0.6s ease-in-out 3; }
        .bot-img-small.tilt-small { animation: wobbleSmall 0.6s ease-in-out 3; }

        .arm-ghost { position: absolute; width: 0; height: 0; }

        .eye-glow {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            transition: opacity 0.3s;
        }
        .eye-glow.glow {
            opacity: 1;
            background: rgba(150, 200, 255, 0.55);
            box-shadow: 0 0 22px 10px rgba(90, 160, 255, 0.85);
        }
        .eg-big { width: 14px; height: 14px; top: 33%; }
        .eg-big-l { left: 36%; }
        .eg-big-r { left: 55%; }
        .eg-small { width: 10px; height: 10px; top: 33%; }
        .eg-small-l { left: 60%; }
        .eg-small-r { left: 42%; }

        .mouth-glow {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            transition: opacity 0.3s;
            background: rgba(120, 190, 255, 0.5);
            filter: blur(3px);
        }
        .mouth-glow.happy, .mouth-glow.happy-small { opacity: 1; }
        .mg-big { width: 30px; height: 10px; top: 44%; left: 41%; }
        .mg-small { width: 20px; height: 7px; top: 44%; left: 41%; }

        .chest-glow {
            position: absolute;
            border-radius: 50%;
            opacity: 0.55;
            pointer-events: none;
            z-index: 6;
            background: radial-gradient(circle, rgba(150,200,255,0.9), transparent 70%);
            box-shadow: 0 0 18px rgba(90,160,255,0.6);
            transition: transform 0.4s, opacity 0.4s;
        }
        .cg-big { width: 20px; height: 20px; top: 80%; left: 42%; }
        .cg-small { width: 15px; height: 15px; top: 80%; left: 55%; }
        .chest-glow.pulse-belly { animation: pulseChestBig 0.6s ease-in-out 4; }
        .chest-glow.pulse-small { animation: pulseChestSmall 0.6s ease-in-out 4; }
        @keyframes pulseChestBig {
            0%, 100% { transform: scale(1); opacity: 0.55; }
            50% { transform: scale(1.7); opacity: 1; }
        }
        @keyframes pulseChestSmall {
            0%, 100% { transform: scale(1); opacity: 0.55; }
            50% { transform: scale(1.8); opacity: 1; }
        }

        /* --- SPEECH BUBBLES --- */
        .speech-bubble, .speech-bubble-small {
            position: absolute;
            background: white;
            border: 3px solid #0a121c;
            border-radius: 18px;
            padding: 10px 20px;
            color: #0a121c;
            font-weight: 800;
            font-size: 15px;
            white-space: nowrap;
            z-index: 20;
            opacity: 0;
            transform: scale(0.4);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            pointer-events: none;
            min-width: 150px;
        }
        .speech-bubble {
            top: -58px;
            left: -50%;
            transform: translateX(-10%) scale(0.4) rotate(-4deg);
        }
        .speech-bubble.show {
            opacity: 1;
            transform: translateX(-10%) scale(1) rotate(0deg);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 30%;
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 18px solid white;
        }

        .speech-bubble-small {
            top: -52px;
            right: -60%;
            transform: translateX(10%) scale(0.4) rotate(4deg);
            background: #f0f0ff;
            font-size: 12px;
            min-width: 110px;
            padding: 8px 16px;
        }
        .speech-bubble-small.show {
            opacity: 1;
            transform: translateX(10%) scale(1) rotate(0deg);
        }
        .speech-bubble-small::after {
            content: '';
            position: absolute;
            bottom: -15px;
            right: 25%;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 16px solid #f0f0ff;
        }

        /* ----- Status Bar ----- */
        .status-bar {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(129, 140, 248, 0.15);
            border-radius: 30px;
            border: 1px solid rgba(129, 140, 248, 0.2);
            font-size: 12px;
            color: #a78bfa;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .status-bar:hover {
            background: rgba(129, 140, 248, 0.25);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.5s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.6); }
        }

        /* ----- AI BADGE ----- */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 4px auto 14px;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(129, 140, 248, 0.45);
            background: rgba(129, 140, 248, 0.08);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.2);
        }
        .ai-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 10px #34d399, 0 0 20px #34d399;
            animation: aiPulse 1.4s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes aiPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .ai-badge-text {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #a78bfa, #818cf8, #34d399, #818cf8, #a78bfa);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: aiShimmer 4s linear infinite;
        }
        @keyframes aiShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        /* ----- LOGIN UI ----- */
        h2 {
            color: #818cf8;
            text-shadow: 0 0 24px #818cf8, 0 0 60px #7c3aed;
            letter-spacing: 5px;
            margin-bottom: 18px;
            font-weight: 800;
            font-size: 20px;
        }
        .field {
            position: relative;
            margin: 10px 0;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(129, 140, 248, 0.4);
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            transition: 0.3s;
        }
        .field:focus-within {
            border-color: #818cf8;
            box-shadow: 0 0 28px rgba(129, 140, 248, 0.55);
            background: rgba(0,0,0,0.6);
        }
        .field .sweep {
            position: absolute;
            top: 0; left: -40%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(129,140,248,0.4), transparent);
            animation: sweepMove 2.8s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes sweepMove {
            0% { left: -40%; }
            100% { left: 120%; }
        }
        .field .field-icon {
            position: absolute;
            left: 15px; top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            opacity: 0.6;
            transition: 0.3s;
            pointer-events: none;
        }
        .field:focus-within .field-icon {
            opacity: 1;
            filter: drop-shadow(0 0 6px #818cf8);
        }
        .field .toggle-pass {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            background: none; border: none;
            cursor: pointer;
            opacity: 0.55;
            padding: 4px;
            transition: 0.3s;
        }
        .field .toggle-pass:hover { opacity: 1; filter: drop-shadow(0 0 6px #818cf8); }
        input {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 13px 40px 13px 42px;
            border: none;
            background: transparent;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
        }
        input::placeholder {
            color: rgba(255,255,255,0.5);
            font-weight: 300;
            letter-spacing: 1px;
        }

        button.enter {
            width: 100%;
            padding: 15px;
            margin-top: 16px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(90deg, #818cf8, #7c3aed, #a78bfa);
            background-size: 200% auto;
            color: white;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 8px 30px rgba(129, 140, 248, 0.5);
        }
        button.enter:hover {
            background-position: right center;
            transform: translateY(-4px);
            box-shadow: 0 14px 44px rgba(129, 140, 248, 0.8);
        }

        .timer-display {
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
        }

        .particle-trail {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #818cf8, transparent);
            box-shadow: 0 0 20px #818cf8;
            animation: trailFade 1s ease-out forwards;
        }
        @keyframes trailFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(129, 140, 248, 0.3);
            animation: ringPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes ringPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.1; }
        }

        .glow-ring-small {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(167, 139, 250, 0.3);
            animation: ringPulseSmall 2.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes ringPulseSmall {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.1; }
        }

        .floating-emoji {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 3s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
        }

        /* ----- Pipeline Flow Indicator ----- */
        .pipeline-flow {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 12px;
            background: rgba(12, 18, 34, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(129, 140, 248, 0.2);
            pointer-events: none;
        }
        .pipeline-flow span {
            color: rgba(129, 140, 248, 0.5);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            animation: flowPulse 2s ease-in-out infinite;
        }
        .pipeline-flow span:nth-child(2) { animation-delay: 0.3s; }
        .pipeline-flow span:nth-child(3) { animation-delay: 0.6s; }
        .pipeline-flow span:nth-child(4) { animation-delay: 0.9s; }
        .pipeline-flow span:nth-child(5) { animation-delay: 1.2s; }

        @keyframes flowPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); color: #818cf8; }
        }

        @media (max-width: 480px) {
            .login-card { width: 92%; padding: 20px; }
            .robot-group { gap: 15px; height: 170px; }
            .bot-img-big { width: 115px; }
            .bot-img-small { width: 78px; }
            .speech-bubble { font-size: 12px; min-width: 100px; padding: 6px 12px; }
            .speech-bubble-small { font-size: 10px; min-width: 80px; padding: 4px 10px; }
            h2 { font-size: 16px; }
            .tool-item { font-size: 18px; }
            .pipeline-flow { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== LIVE WAVE CANVAS ===== -->
    <canvas id="mainCanvas"></canvas>

    <!-- ===== DEVOPS TOOLS BACKGROUND ===== -->

    <!-- ===== PIPELINE FLOW INDICATOR ===== -->

        <span>🔄 TEST</span>

    <!-- ===== LOGIN CARD ===== -->
    <div class="login-card">
        <div class="robot-group">
            <!-- Big Robot -->
            <div class="bot-big" id="bigBot">

                <div class="eye-glow eg-big eg-big-l" id="bigEyes"></div>

                <div class="eye-glow eg-small eg-small-l" id="smallEyes"></div>
                <div class="eye-glow eg-small eg-small-r" id="smallEyes2"></div>
                <div class="mouth-glow mg-small" id="smallSmile"></div>
                <div class="chest-glow cg-small" id="smallBelly"></div>
                <div class="arm-ghost" id="smallArm"></div>
            </div>
        </div>

        <div class="ai-badge">
            <span class="ai-dot"></span>
            <span class="ai-badge-text">AI-Powered Security Agent</span>
        </div>

        <h2>✦ DEVOPS PORTAL ✦</h2>
        <form id="portalForm">
            <div class="field">
                <div class="sweep"></div>
                <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c7d0ff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input type="text" id="userInput" placeholder="Username" required>
            </div>
            <div class="field">
                <div class="sweep"></div>
                <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c7d0ff" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <input type="password" id="passInput" placeholder="Password" required>
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c7d0ff" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button type="submit" class="enter">⚡ DEPLOY ⚡</button>
        </form>

        <div class="status-bar" id="statusBar">
            <span class="status-dot"></span>
            <span id="statusText">Dual Agents Online · Auto-speak every 5s</span>
        </div>
        <div class="timer-display" id="timerDisplay">⏱️ Next speak in 5s</div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. CANVAS — LIVE WAVE BACKGROUND
            // ============================================================
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const ripples = [];
            const MAX_RIPPLES = 50;
            const stars = [], particles = [], glowingOrbs = [], sparkles = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 500; i++) {
                stars.push({
                    x: Math.random() * W, y: Math.random() * H,
                    s: Math.random() * 2.5 + 0.3,
                    a: Math.random() * 0.6 + 0.15,
                    twinkle: Math.random() * 0.04 + 0.005,
                    phase: Math.random() * Math.PI * 2,
                    color: ['#ffffff', '#818cf8', '#a78bfa', '#60a5fa', '#34d399'][Math.floor(Math.random() * 5)]
                });
            }
            for (let i = 0; i < 18; i++) {
                glowingOrbs.push({
                    x: Math.random() * W, y: Math.random() * H,
                    r: Math.random() * 160 + 80,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    color: ['#818cf8', '#7c3aed', '#60a5fa', '#34d399', '#a78bfa', '#f59e0b'][Math.floor(Math.random() * 6)],
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.015 + 0.005
                });
            }
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * W, y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    s: Math.random() * 3 + 0.5,
                    a: Math.random() * 0.5 + 0.05,
                    color: ['#818cf8', '#7c3aed', '#60a5fa', '#34d399', '#a78bfa', '#f59e0b'][Math.floor(Math.random() * 6)],
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.025 + 0.005
                });
            }
            for (let i = 0; i < 80; i++) {
                sparkles.push({
                    x: Math.random() * W, y: Math.random() * H,
                    s: Math.random() * 2.5 + 0.4,
                    life: Math.random() * 140 + 40,
                    maxLife: Math.random() * 180 + 60,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    color: ['#ffffff', '#818cf8', '#a78bfa', '#60a5fa'][Math.floor(Math.random() * 4)]
                });
            }

            class Ripple {
                constructor(x, y) {
                    this.x = x; this.y = y;
                    this.radius = 0;
                    this.maxRadius = Math.max(W, H) * 0.7 + Math.random() * 300;
                    this.speed = 3 + Math.random() * 4;
                    this.life = 1;
                    this.decay = 0.003 + Math.random() * 0.008;
                    this.color = ['#818cf8', '#7c3aed', '#60a5fa', '#a78bfa', '#34d399', '#f59e0b'][Math.floor(Math.random() * 6)];
                    this.width = 2 + Math.random() * 3;
                    this.phase = Math.random() * Math.PI * 2;
                }
                update() {
                    this.radius += this.speed;
                    this.life -= this.decay;
                    this.phase += 0.07;
                    return this.life > 0 && this.radius < this.maxRadius;
                }
                draw(ctx) {
                    const alpha = this.life * (0.4 + 0.3 * Math.sin(this.phase));
                    const w = this.width * (0.5 + 0.5 * this.life);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = w;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 35 * this.life;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = alpha * 0.3;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = w * 1.8;
                    ctx.shadowBlur = 60 * this.life;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = alpha * 0.15;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1.5;
                    ctx.shadowBlur = 80 * this.life;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 1.2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            function drawDeepSpace() {
                ctx.fillStyle = '#070b14';
                ctx.fillRect(0, 0, W, H);
                const grad = ctx.createRadialGradient(W*0.5, H*0.25, 0, W*0.5, H*0.25, Math.max(W, H)*0.95);
                grad.addColorStop(0, '#14243e');
                grad.addColorStop(0.4, '#0b1324');
                grad.addColorStop(0.7, '#070b14');
                grad.addColorStop(1, '#03050a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }
            function drawGlowingOrbs() {
                glowingOrbs.forEach(orb => {
                    orb.x += orb.vx; orb.y += orb.vy; orb.phase += orb.speed;
                    if (orb.x < -orb.r || orb.x > W + orb.r) orb.vx *= -1;
                    if (orb.y < -orb.r || orb.y > H + orb.r) orb.vy *= -1;
                    const pulse = 1 + 0.15 * Math.sin(orb.phase);
                    const r = orb.r * pulse;
                    const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, r);
                    grad.addColorStop(0, orb.color + '40');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(orb.x, orb.y, r, 0, Math.PI*2); ctx.fill();
                });
            }
            function drawStars() {
                stars.forEach(s => {
                    s.phase += s.twinkle;
                    const twinkle = 0.5 + 0.5 * Math.sin(s.phase);
                    ctx.globalAlpha = s.a * twinkle;
                    ctx.fillStyle = s.color;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
            function drawParticles() {
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.phase += p.speed;
                    if (p.x < 0 || p.x > W) p.vx *= -1;
                    if (p.y < 0 || p.y > H) p.vy *= -1;
                    const alpha = p.a * (0.6 + 0.4 * Math.sin(p.phase));
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
            function drawSparkles() {
                sparkles.forEach(s => {
                    s.x += s.vx; s.y += s.vy; s.life--;
                    if (s.life <= 0) {
                        s.x = Math.random() * W; s.y = Math.random() * H;
                        s.life = Math.random() * 180 + 50; s.maxLife = s.life;
                        s.vx = (Math.random() - 0.5) * 0.8; s.vy = (Math.random() - 0.5) * 0.8;
                    }
                    const ratio = s.life / s.maxLife;
                    const alpha = ratio * 0.7;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = s.color;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.s * ratio, 0, Math.PI*2); ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
            function drawRipples() {
                ripples.forEach(r => r.draw(ctx));
            }

            function animate() {
                drawDeepSpace();
                drawGlowingOrbs();
                drawStars();
                drawParticles();
                drawSparkles();
                drawRipples();
                for (let i = ripples.length - 1; i >= 0; i--) {
                    if (!ripples[i].update()) ripples.splice(i, 1);
                }
                requestAnimationFrame(animate);
            }
            animate();

            canvas.addEventListener('click', function(e) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const count = 5 + Math.floor(Math.random() * 8);
                for (let i = 0; i < count; i++) {
                    const offX = (Math.random() - 0.5) * 100;
                    const offY = (Math.random() - 0.5) * 100;
                    const ripple = new Ripple(x + offX, y + offY);
                    ripple.speed = 2.5 + Math.random() * 4.5;
                    ripple.color = ['#818cf8', '#7c3aed', '#60a5fa', '#a78bfa', '#34d399', '#f59e0b'][Math.floor(Math.random() * 6)];
                    ripples.push(ripple);
                }
                while (ripples.length > MAX_RIPPLES) ripples.shift();
                spawnFloatingEmoji(e.clientX, e.clientY);
            });

            // ============================================================
            // 2. DEVOPS TOOLS — Floating Tools in Background
            // ============================================================
            const devopsTools = [
                { icon: '🐳', name: 'Docker' },
                { icon: '☸️', name: 'K8s' },
                { icon: '⚙️', name: 'Jenkins' },
                { icon: '📊', name: 'Grafana' },
                { icon: '🔍', name: 'Elastic' },
                { icon: '📦', name: 'Helm' },
                { icon: '🔧', name: 'Ansible' },
                { icon: '🌐', name: 'Nginx' },
                { icon: '🔄', name: 'Git' },
                { icon: '📝', name: 'Terraform' },
                { icon: '🚀', name: 'ArgoCD' },
                { icon: '📈', name: 'Prometheus' },
                { icon: '🔒', name: 'Vault' },
                { icon: '☁️', name: 'AWS' },
                { icon: '🐍', name: 'Python' }
            ];

            const toolsContainer = document.getElementById('devopsTools');
            
            devopsTools.forEach((tool, index) => {
                const el = document.createElement('div');
                el.className = 'tool-item';
                if (Math.random() > 0.6) el.classList.add('glow');
                el.innerHTML = `<span class="tool-icon">${tool.icon}</span> ${tool.name}`;
                
                // Random position and movement
                const startX = Math.random() * 100;
                const startY = Math.random() * 100;
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200;
                const tx2 = (Math.random() - 0.5) * 200;
                const ty2 = (Math.random() - 0.5) * 200;
                
                el.style.left = startX + '%';
                el.style.top = startY + '%';
                el.style.setProperty('--tx', tx + 'px');
                el.style.setProperty('--ty', ty + 'px');
                el.style.setProperty('--tx2', tx2 + 'px');
                el.style.setProperty('--ty2', ty2 + 'px');
                el.style.animationDuration = (20 + Math.random() * 30) + 's';
                el.style.animationDelay = (Math.random() * 10) + 's';
                el.style.fontSize = (20 + Math.random() * 18) + 'px';
                el.style.opacity = 0.15 + Math.random() * 0.2;
                
                toolsContainer.appendChild(el);
            });

            // ============================================================
            // 3. FLOATING EMOJI FEATURE
            // ============================================================
            function spawnFloatingEmoji(x, y) {
                const emojis = ['🚀', '✨', '💫', '⭐', '🔥', '💎', '🌟', '⚡', '🎯', '💪', '🤖', '🎉', '🔄', '📦', '🔧'];
                const emoji = document.createElement('div');
                emoji.className = 'floating-emoji';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = x + 'px';
                emoji.style.top = y + 'px';
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 3000);
            }

            // ============================================================
            // 4. DUAL ROBOTS — AMAZING AUTO ACTIONS
            // ============================================================
            const bigArm = document.getElementById('bigArm');
            const smallArm = document.getElementById('smallArm');
            const bigBubble = document.getElementById('bigBubble');
            const smallBubble = document.getElementById('smallBubble');
            const bigHead = document.getElementById('bigHead');
            const smallHead = document.getElementById('smallHead');
            const bigSmile = document.getElementById('bigSmile');
            const smallSmile = document.getElementById('smallSmile');
            const bigBelly = document.getElementById('bigBelly');
            const smallBelly = document.getElementById('smallBelly');
            const bigEyes = document.getElementById('bigEyes');
            const bigEyes2 = document.getElementById('bigEyes2');
            const smallEyes = document.getElementById('smallEyes');
            const smallEyes2 = document.getElementById('smallEyes2');
            const bigBot = document.getElementById('bigBot');
            const smallBot = document.getElementById('smallBot');
            const statusText = document.getElementById('statusText');
            const timerDisplay = document.getElementById('timerDisplay');
            const statusBar = document.getElementById('statusBar');

            let speechCount = 0;
            let autoActive = true;
            let intervalId = null;

            bigArm.classList.add('idle');
            smallArm.classList.add('idle-small');

            document.addEventListener('mousemove', (e) => {
                const pupils = document.querySelectorAll('.pupil');
                const mx = (e.clientX / window.innerWidth - 0.5) * 2;
                const my = (e.clientY / window.innerHeight - 0.5) * 2;
                pupils.forEach(pupil => {
                    pupil.style.transform = `translateX(-50%) translate(${mx * 8}px, ${my * 8}px)`;
                });
            });

            function amazingDualAction(bigText, smallText, callback) {
                bigBubble.textContent = bigText;
                bigBubble.classList.add('show');
                smallBubble.textContent = smallText;
                smallBubble.classList.add('show');

                speechCount++;
                statusText.textContent = `🤖 "${bigText}" · ✨ "${smallText}"`;

                bigArm.classList.remove('idle');
                bigArm.classList.add('wave');
                smallArm.classList.remove('idle-small');
                smallArm.classList.add('wave-small');

                bigHead.classList.add('tilt-head');
                smallHead.classList.add('tilt-small');

                bigSmile.classList.add('happy');
                smallSmile.classList.add('happy-small');

                bigBelly.classList.add('pulse-belly');
                smallBelly.classList.add('pulse-small');

                bigEyes.classList.add('glow');
                bigEyes2.classList.add('glow');
                smallEyes.classList.add('glow');
                smallEyes2.classList.add('glow');

                const rect = bigBot.getBoundingClientRect();
                spawnFloatingEmoji(rect.left + 50, rect.top - 20);
                const rect2 = smallBot.getBoundingClientRect();
                spawnFloatingEmoji(rect2.left + 50, rect2.top - 20);

                // Highlight a random tool
                const tools = document.querySelectorAll('.tool-item');
                const randomTool = tools[Math.floor(Math.random() * tools.length)];
                if (randomTool) {
                    randomTool.style.color = '#818cf8';
                    randomTool.style.textShadow = '0 0 40px rgba(129, 140, 248, 0.6)';
                    randomTool.style.opacity = '0.8';
                    setTimeout(() => {
                        randomTool.style.color = '';
                        randomTool.style.textShadow = '';
                        randomTool.style.opacity = '';
                    }, 1500);
                }

                setTimeout(() => {
                    bigArm.classList.remove('wave');
                    bigArm.classList.add('idle');
                    smallArm.classList.remove('wave-small');
                    smallArm.classList.add('idle-small');
                    bigHead.classList.remove('tilt-head');
                    smallHead.classList.remove('tilt-small');
                    bigSmile.classList.remove('happy');
                    smallSmile.classList.remove('happy-small');
                    bigBelly.classList.remove('pulse-belly');
                    smallBelly.classList.remove('pulse-small');
                    bigEyes.classList.remove('glow');
                    bigEyes2.classList.remove('glow');
                    smallEyes.classList.remove('glow');
                    smallEyes2.classList.remove('glow');
                    bigBubble.classList.remove('show');
                    smallBubble.classList.remove('show');

                    if (autoActive) {
                        statusText.textContent = 'Dual Agents Online · Auto-speak every 5s';
                    } else {
                        statusText.textContent = '⏸️ Auto-speak paused';
                    }
                    if (callback) callback();
                }, 2800);
            }

            const bigMessages = [
                '🤖 Welcome to DevOps Agent',
                '💬 How are you?',
                '🔐 Kindly login DevOps Agent',
                '🚀 Deploying pipeline...',
                '⚡ Agent is ready',
                '📦 CI/CD active',
                '🔄 Syncing repositories',
                '✅ All systems nominal',
                '🌟 DevOps is life',
                '🔧 Configuring nodes',
                '🎯 Target acquired',
                '💎 System optimized',
                '🐳 Docker ready',
                '☸️ K8s orchestrated'
            ];

            const smallMessages = [
                '✨ Hi there!',
                '🌟 I\'m here too!',
                '💪 Let\'s go!',
                '🎯 Ready!',
                '🔥 Amazing!',
                '🚀 Deploy!',
                '💡 Great!',
                '⭐ Awesome!',
                '🔮 Yes!',
                '💎 Nice!',
                '🎉 Woo!',
                '⚡ Powered!'
            ];

            let msgIndex = 0;

            function autoAmazingAction() {
                if (!autoActive) return;
                const bigMsg = bigMessages[msgIndex % bigMessages.length];
                const smallMsg = smallMessages[msgIndex % smallMessages.length];
                msgIndex++;
                amazingDualAction(bigMsg, smallMsg);
            }

            function startAutoCycle() {
                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(autoAmazingAction, 5000);
                autoActive = true;
                statusText.textContent = 'Dual Agents Online · Auto-speak every 5s';
                timerDisplay.textContent = '⏱️ Next speak in 5s';
            }

            function stopAutoCycle() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                autoActive = false;
                statusText.textContent = '⏸️ Auto-speak paused';
                timerDisplay.textContent = '⏸️ Paused';
            }

            startAutoCycle();

            let secondsLeft = 5;
            setInterval(() => {
                if (!autoActive) {
                    timerDisplay.textContent = '⏸️ Paused';
                    return;
                }
                secondsLeft--;
                if (secondsLeft <= 0) secondsLeft = 5;
                timerDisplay.textContent = `⏱️ Next speak in ${secondsLeft}s`;
            }, 1000);

            setTimeout(() => {
                amazingDualAction('🤖 DevOps Agent Online', '✨ Sidekick ready!');
            }, 600);

            // ============================================================
            // 5. LOGIN
            // ============================================================
            const form = document.getElementById('portalForm');

            // Password show/hide toggle
            const passInput = document.getElementById('passInput');
            const togglePass = document.getElementById('togglePass');
            togglePass.addEventListener('click', () => {
                const isHidden = passInput.type === 'password';
                passInput.type = isHidden ? 'text' : 'password';
                togglePass.style.opacity = isHidden ? '1' : '0.55';
            });

            // Robot reacts when you start typing credentials
            const userInput = document.getElementById('userInput');
            let fieldReacted = false;
            function reactOnce(msgBig, msgSmall) {
                if (fieldReacted) return;
                fieldReacted = true;
                amazingDualAction(msgBig, msgSmall, () => { fieldReacted = false; });
            }
            userInput.addEventListener('focus', () => reactOnce('👀 Watching you type...', '🔎 Go on!'));
            passInput.addEventListener('focus', () => reactOnce('🔒 Keeping it secret!', '🙈 Not peeking!'));

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const wasActive = autoActive;
                if (wasActive) stopAutoCycle();

                amazingDualAction('🔍 Scanning credentials...', '📡 Analyzing...', () => {
                    setTimeout(() => {
                        amazingDualAction('✅ Deploy Approved!', '🎉 Welcome!', () => {
                            alert('🚀 Welcome, DevOps Engineer. Dual agents ready!');
                            if (wasActive) startAutoCycle();
                        });
                    }, 300);
                });
            });

            document.querySelector('.login-card').addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('form')) return;
                const wasActive = autoActive;
                if (wasActive) stopAutoCycle();
                amazingDualAction('🤖 At your service!', '💫 Me too!', () => {
                    if (wasActive) startAutoCycle();
                });
            });

            statusBar.addEventListener('click', function() {
                if (autoActive) {
                    stopAutoCycle();
                } else {
                    startAutoCycle();
                    secondsLeft = 5;
                }
            });

            // ============================================================
            // 6. DANCE ON DOUBLE CLICK
            // ============================================================
            document.querySelector('.robot-group').addEventListener('dblclick', function() {
                const wasActive = autoActive;
                if (wasActive) stopAutoCycle();
                
                bigArm.classList.remove('idle');
                bigArm.classList.add('wave');
                smallArm.classList.remove('idle-small');
                smallArm.classList.add('wave-small');
                
                bigHead.classList.add('tilt-head');
                smallHead.classList.add('tilt-small');
                
                bigSmile.classList.add('happy');
                smallSmile.classList.add('happy-small');
                
                bigBelly.classList.add('pulse-belly');
                smallBelly.classList.add('pulse-small');
                
                bigEyes.classList.add('glow');
                bigEyes2.classList.add('glow');
                smallEyes.classList.add('glow');
                smallEyes2.classList.add('glow');
                
                bigBubble.textContent = '🎉 DANCE! 🎉';
                bigBubble.classList.add('show');
                smallBubble.textContent = '💃🕺';
                smallBubble.classList.add('show');
                
                statusText.textContent = '💃 Robots dancing! 🕺';
                
                for (let i = 0; i < 12; i++) {
                    setTimeout(() => {
                        spawnFloatingEmoji(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight * 0.5
                        );
                    }, i * 150);
                }
                
                // Highlight all tools
                document.querySelectorAll('.tool-item').forEach((tool, idx) => {
                    setTimeout(() => {
                        tool.style.color = '#818cf8';
                        tool.style.textShadow = '0 0 40px rgba(129, 140, 248, 0.6)';
                        tool.style.opacity = '0.9';
                        setTimeout(() => {
                            tool.style.color = '';
                            tool.style.textShadow = '';
                            tool.style.opacity = '';
                        }, 800);
                    }, idx * 80);
                });
                
                setTimeout(() => {
                    bigArm.classList.remove('wave');
                    bigArm.classList.add('idle');
                    smallArm.classList.remove('wave-small');
                    smallArm.classList.add('idle-small');
                    bigHead.classList.remove('tilt-head');
                    smallHead.classList.remove('tilt-small');
                    bigSmile.classList.remove('happy');
                    smallSmile.classList.remove('happy-small');
                    bigBelly.classList.remove('pulse-belly');
                    smallBelly.classList.remove('pulse-small');
                    bigEyes.classList.remove('glow');
                    bigEyes2.classList.remove('glow');
                    smallEyes.classList.remove('glow');
                    smallEyes2.classList.remove('glow');
                    bigBubble.classList.remove('show');
                    smallBubble.classList.remove('show');
                    if (wasActive) {
                        startAutoCycle();
                        statusText.textContent = 'Dual Agents Online · Auto-speak every 5s';
                    } else {
                        statusText.textContent = '⏸️ Auto-speak paused';
                    }
                }, 2500);
            });

            // ============================================================
            // 7. MOUSE TRAIL
            // ============================================================
            let mouseTrailTimeout;
            document.addEventListener('mousemove', (e) => {
                if (mouseTrailTimeout) return;
                mouseTrailTimeout = setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle-trail';
                    particle.style.left = (e.clientX - 4) + 'px';
                    particle.style.top = (e.clientY - 4) + 'px';
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 1000);
                    mouseTrailTimeout = null;
                }, 50);
            });

        })();
    </script>
</body>
</html>
